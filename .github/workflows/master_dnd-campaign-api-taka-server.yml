name: Build and deploy - DnDCampaignManager

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dndcampaignmanager_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dndcampaignmanager_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=dndcampaignmanager_ci;Username=ci;Password=ci-only-password
      OpenAI__ApiKey: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: DnDCampaignManager.web/package-lock.json
      - name: Configure temporary JWT signing key
        shell: pwsh
        run: |
          "Jwt__SigningKeys__0__Kid=ci" >> $env:GITHUB_ENV
          "Jwt__SigningKeys__0__Key=$([Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(64)))" >> $env:GITHUB_ENV
      - name: Install frontend dependencies
        working-directory: DnDCampaignManager.web
        run: npm ci
      - name: Frontend regression tests
        working-directory: DnDCampaignManager.web
        run: npm test
      - name: Frontend lint
        working-directory: DnDCampaignManager.web
        run: npm run lint
      - name: Backend regression checks
        shell: pwsh
        run: ./scripts/Run-RegressionChecks.ps1

  build:
    needs: regression
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: DnDCampaignManager.web/package-lock.json

      - name: Install frontend deps
        working-directory: DnDCampaignManager.web
        run: npm ci

      - name: Build frontend
        working-directory: DnDCampaignManager.web
        run: npm run build

      - name: Verify frontend output
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "DnDCampaignManager.Api/wwwroot/index.html" -PathType Leaf)) {
            throw "Frontend build did not produce API wwwroot/index.html."
          }
          if (!(Get-ChildItem -LiteralPath "DnDCampaignManager.Api/wwwroot/assets" -Filter "*.js" -File)) {
            throw "Frontend build did not produce JavaScript assets."
          }

      # IMPORTANT: publish AFTER wwwroot is populated
      - name: Publish API
        run: dotnet publish DnDCampaignManager.Api/DnDCampaignManager.Api.csproj -c Release -o ./publish

      - name: Verify published frontend
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "publish/wwwroot/index.html" -PathType Leaf)) {
            throw "Published API is missing the frontend index.html."
          }
          if (!(Get-ChildItem -LiteralPath "publish/wwwroot/assets" -Filter "*.js" -File)) {
            throw "Published API is missing frontend JavaScript assets."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write   # REQUIRED for OIDC
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ./app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D95FA1973BE646F4B8D90BF389A6DDEB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8DFBDE5E1A0E4E4DA130C64F7E4F1488 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C32B8157203C47BA9B23A70B3F26696A }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: dnd-campaign-api-taka-server
          package: ./app
