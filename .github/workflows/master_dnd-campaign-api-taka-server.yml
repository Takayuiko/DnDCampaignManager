name: Build and deploy - DnDCampaignManager

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: DnDCampaignManager.web/package-lock.json

      - name: Install frontend deps
        working-directory: DnDCampaignManager.web
        run: npm ci

      - name: Build frontend
        working-directory: DnDCampaignManager.web
        run: npm run build

      - name: Verify frontend output
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "DnDCampaignManager.Api/wwwroot/index.html" -PathType Leaf)) {
            throw "Frontend build did not produce API wwwroot/index.html."
          }
          if (!(Get-ChildItem -LiteralPath "DnDCampaignManager.Api/wwwroot/assets" -Filter "*.js" -File)) {
            throw "Frontend build did not produce JavaScript assets."
          }

      # IMPORTANT: publish AFTER wwwroot is populated
      - name: Publish API
        run: dotnet publish DnDCampaignManager.Api/DnDCampaignManager.Api.csproj -c Release -o ./publish

      - name: Verify published frontend
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "publish/wwwroot/index.html" -PathType Leaf)) {
            throw "Published API is missing the frontend index.html."
          }
          if (!(Get-ChildItem -LiteralPath "publish/wwwroot/assets" -Filter "*.js" -File)) {
            throw "Published API is missing frontend JavaScript assets."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write   # REQUIRED for OIDC
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ./app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D95FA1973BE646F4B8D90BF389A6DDEB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8DFBDE5E1A0E4E4DA130C64F7E4F1488 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C32B8157203C47BA9B23A70B3F26696A }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: dnd-campaign-api-taka-server
          package: ./app
