name: Build and deploy - DnDCampaignManager

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: DnDCampaignManager.web/package-lock.json

      - name: Install frontend deps
        working-directory: DnDCampaignManager.web
        run: npm ci

      - name: Build frontend
        working-directory: DnDCampaignManager.web
        run: npm run build

      - name: Copy frontend dist -> API wwwroot
        run: |
          $wwwroot = "DnDCampaignManager.Api/wwwroot"
          if (!(Test-Path $wwwroot)) { New-Item -ItemType Directory -Path $wwwroot | Out-Null }
          
          # Clean wwwroot
          Get-ChildItem -Path $wwwroot -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          # Copy dist into wwwroot
          Copy-Item -Path "DnDCampaignManager.web/dist/*" -Destination $wwwroot -Recurse -Force

          # Sanity check
          Write-Host "=== wwwroot contents ==="
          Get-ChildItem -Path $wwwroot -Recurse | Select-Object FullName

      # IMPORTANT: publish AFTER wwwroot is populated
      - name: Publish API
        run: dotnet publish DnDCampaignManager.Api/DnDCampaignManager.Api.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write   # REQUIRED for OIDC
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ./app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: AZUREAPPSERVICE_CLIENTID_D95FA1973BE646F4B8D90BF389A6DDEB
          tenant-id: AZUREAPPSERVICE_TENANTID_8DFBDE5E1A0E4E4DA130C64F7E4F1488
          subscription-id: AZUREAPPSERVICE_SUBSCRIPTIONID_C32B8157203C47BA9B23A70B3F26696A

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: dnd-campaign-api-taka-server
          package: ./app
