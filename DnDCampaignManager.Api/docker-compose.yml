services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dndcamp-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - dndcamp_sql_data:/var/opt/mssql

volumes:
  dndcamp_sql_data: