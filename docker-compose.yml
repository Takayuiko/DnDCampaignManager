services:
  postgres:
    image: postgres:16
    container_name: dndcampaignmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dndcampaignmanager}
      POSTGRES_USER: ${POSTGRES_USER:-dndadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dndpassword}
    ports:
      - "5432:5432"
    volumes:
      - dnd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dndadmin} -d ${POSTGRES_DB:-dndcampaignmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dnd_postgres_data:
